security_properties:
  encryption:
    implemented: true
    mechanism: AES-256-GCM in browser (Web Crypto API); per-file DEK wrapping
    keys_stored_securely: true
    plaintext_ever_logged: false
    iv_unique_per_operation: true
  accounts:
    implemented: true
    password_hashing: argon2id
    rate_limiting: true
    session_invalidation_on_logout: true
    tokens_httponly: true
  rbac:
    implemented: true
    roles_defined:
    - file owner
    - 'share recipient: view/download/reshare grants'
    server_side_enforcement: true
    privilege_escalation_tested: true
  networking:
    implemented: true
    tls_enforced: false
    certificates_validated: true
  audit_log:
    implemented: true
    log_format: SQLite security events with HMAC-SHA-256 chain
    tamper_evident: true
    sensitive_data_excluded: true
ux_review:
  primary_flows_screenshots_included: true
  error_messages_reviewed: false
  secure_defaults_verified: false
  cli_help_complete: N/A
documentation:
  readme_complete: true
  setup_reproducible: false
  audit_instructions_complete: true
  dependency_scan_run: true
known_limitations:
- description: 'Local Host only'
  severity: 'Low'
  reason_accepted: 'The application is designed to run in a local development environment and is not intended for production use yet'
